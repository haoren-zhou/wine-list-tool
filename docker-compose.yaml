services:
  frontend:
    container_name: wine-list-tool-frontend
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend/docker/default.conf:/tmp/default.conf:ro
    environment: 
      - FASTAPI_SERVER_ADDR=backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:80/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    command: /app/start.sh
    networks:
      - front-tier
      - back-tier
  backend:
    container_name: wine-list-tool-backend
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # local testing; change this if deploying service externally
      - FRONTEND_ORIGINS=http://localhost
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - back-tier

networks:
  front-tier:
    external: True
  back-tier:
    external: False